name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build standalone binaries
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun run build --target="bun-$target" --outfile="dist/skillful-$target"
          done
        shell: bash
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create --verify-tag \
            --notes 'Download the binary for your OS and CPU, mark it executable with `chmod +x`, then run it with `--help`. No Bun installation is required.' \
            -- "$GITHUB_REF_NAME" dist/skillful-{darwin,linux}-{arm64,x64}
